services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: lastmile-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STREAMING_MODE
        value: auto
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: localhost:9092
      - key: KAFKA_SECURITY_PROTOCOL
        value: PLAINTEXT

  # 2. Vehicle Simulator Background Worker
  - type: worker
    name: lastmile-simulator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python simulator/vehicle_simulator.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BASE_URL
        fromService:
          type: web
          name: lastmile-backend
          property: host
