services:
  - type: web
    name: lastmile-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "python simulator/vehicle_simulator.py & uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STREAMING_MODE
        value: auto
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: localhost:9092
      - key: KAFKA_SECURITY_PROTOCOL
        value: PLAINTEXT
